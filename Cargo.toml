[package]
name = "pygarden"
version = "0.2.0"
edition = "2024"

[package.metadata.bundle]
name = "PyGarden"
identifier = "com.julesjung.pygarden"

[dependencies]
fastrand = "2.5.0"
kira = { version = "0.12.5", default-features = false, features = ["cpal", "ogg", "pcm", "vorbis", "wav"] }
macroquad = { version = "0.4.16" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
