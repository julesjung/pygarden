[package]
name = "pygarden"
version = "0.2.0"
edition = "2024"

[package.metadata.bundle]
name = "PyGarden"
identifier = "com.julesjung.pygarden"

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
