name: Build with PyInstaller

on: workflow_dispatch

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run build.py
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}
          path: dist
