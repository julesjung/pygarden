name: Bundle

on:
  push:
    branches: [chore/macroquad-rust]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo install cargo-bundle
      - run: cargo bundle --release
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
              target/release/bundle/osx/PyGarden.app
              target/release/bundle/dmg/PyGarden.dmg

  bundle-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/release/pygarden.exe
